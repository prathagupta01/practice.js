<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>manual calci</h1>

    <div id =  "container">
        <div id = "display0">
            <input type="text" id="display">
        </div>
        <div id = "buttons">
            <div id ="numbers">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>0</button>
            <button>00</button>
            <button>.</button>
            </div>
            <div id = "oprators">
                <button id = "clearbutton">clear</button>
                <button>+</button>
                <button>-</button>
                <button>/</button>
                <button>*</button>
                <button id = "equal">=</button>
            </div> 
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
